[project]
name = "mcp-demo"
version = "0.1.0"
description = "MCP Demo Server with modular architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.16",
    "beautifulsoup4>=4.13.4",
    "feedparser>=6.0.11",
    "mcp[cli]>=1.6.0",
    "requests>=2.32.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
